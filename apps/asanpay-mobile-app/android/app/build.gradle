apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
// Same lookup order as Node: app node_modules first, then the hoisted monorepo root.
def reactNativePackageDir = [file("../../node_modules/react-native"), file("../../../../node_modules/react-native")]
    .find { new File(it, "package.json").exists() }
def hermesCompilerDir = [file("../../node_modules/hermes-compiler"), file("../../../../node_modules/hermes-compiler")]
    .find { new File(it, "package.json").exists() }

react {
    root = file("../../")
    reactNativeDir = reactNativePackageDir
    // Hoisted to the monorepo root (not nested under apps/asanpay-mobile-app/node_modules).
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    cliFile = new File(reactNativePackageDir, "cli.js")
    // The plugin only looks for hermes-compiler under the app's own node_modules.
    hermesCommand = "${hermesCompilerDir.absolutePath}/hermesc/%OS-BIN%/hermesc"
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'io.github.react-native-community:jsc-android-intl:2026004.+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/** White-label brand key: BRAND_NAME=AsanPay → ASANPAY (matches brand.name / BRAND_DEFAULTS.name). */
def brandUploadKey = ((project.findProperty("BRAND_NAME") ?: "AsanPay") as String)
    .toUpperCase()
    .replaceAll(/[^A-Z0-9]+/, "_")
    .replaceAll(/^_+|_+$/, "")

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.asanpay.mobile"
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.asanpay.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Bump APP_VERSION_CODE / APP_VERSION_NAME in src/lib/appVersion.ts together with these.
        versionCode 9
        versionName "1.0.6"
        // true = FLAG_SECURE on every screen (no screenshots / blank recent-apps thumbnail). Debug
        // keeps screenshots for testing; the release build type turns it on.
        buildConfigField "boolean", "ENABLE_SECURE_SCREEN", "false"
    }
    // Uncompressed .so + AGP 8.5.1+ → 16 KB zip alignment in Play-generated APKs.
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // ${brandUploadKey}_UPLOAD_STORE_FILE etc. in ~/.gradle/gradle.properties (or CI).
            def storeFileKey = "${brandUploadKey}_UPLOAD_STORE_FILE"
            def storePassKey = "${brandUploadKey}_UPLOAD_STORE_PASSWORD"
            def keyAliasKey = "${brandUploadKey}_UPLOAD_KEY_ALIAS"
            def keyPassKey = "${brandUploadKey}_UPLOAD_KEY_PASSWORD"

            if (project.hasProperty(storeFileKey)) {
                storeFile file(project.property(storeFileKey) as String)
                storePassword(project.property(storePassKey) as String)
                keyAlias(project.property(keyAliasKey) as String)
                keyPassword(project.property(keyPassKey) as String)
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Fail closed: unsigned if brand upload keystore props missing (do not fall back to debug).
            if (project.hasProperty("${brandUploadKey}_UPLOAD_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Release: no screenshots / screen recording of PIN, OTP and Aadhaar screens.
            buildConfigField "boolean", "ENABLE_SECURE_SCREEN", "true"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("com.google.android.material:material:1.12.0")
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("androidx.activity:activity-ktx:1.9.3")
    implementation("androidx.core:core-splashscreen:1.0.1")
    implementation("com.google.android.play:app-update:2.1.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
