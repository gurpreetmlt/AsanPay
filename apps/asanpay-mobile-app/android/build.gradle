buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        // RN 0.77 + 16 KB page size (Play). Keep compile/target 36 for current Play target.
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// uCrop (crop screen used by react-native-image-crop-picker) is published on JitPack only.
allprojects {
    repositories {
        maven { url "https://jitpack.io" }
    }
}

// AsyncStorage (and other libs) still depend on legacy `react-native` maven artifact.
// Force `react-android` so RN resources (catalyst_*, material) merge correctly.
subprojects { subproject ->
    subproject.configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "com.facebook.react" && details.requested.name == "react-native") {
                details.useTarget("com.facebook.react:react-android:0.77.3")
            }
        }
    }
}
