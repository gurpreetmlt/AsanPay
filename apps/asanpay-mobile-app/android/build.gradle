buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        // NDK r27 = 16 KB page size alignment (Play).
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Reads app/google-services.json (gitignored, kept on the build machine only).
        classpath("com.google.gms:google-services:4.5.0")
    }
}

apply plugin: "com.facebook.react.rootproject"

// uCrop (crop screen used by react-native-image-crop-picker) is published on JitPack only.
allprojects {
    repositories {
        maven { url "https://jitpack.io" }
    }
}

// AsyncStorage (and other libs) still depend on legacy `react-native` maven artifact.
// Force `react-android` so RN resources (catalyst_*, material) merge correctly.
// App node_modules first, then the hoisted monorepo root (same order as Node resolution).
def reactNativePackageJson = [file("../node_modules/react-native/package.json"), file("../../../node_modules/react-native/package.json")]
    .find { it.exists() }
def reactNativeVersion = new groovy.json.JsonSlurper()
    .parse(reactNativePackageJson)
    .version
subprojects { subproject ->
    subproject.configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "com.facebook.react" && details.requested.name == "react-native") {
                details.useTarget("com.facebook.react:react-android:${reactNativeVersion}")
            }
        }
    }
}
