# Pre-commit hooks for AsanPay
# Blocks secrets before commit; also basic hygiene checks.
# Install: pre-commit install
# Run all: pre-commit run --all-files

# Skip generated / vendor / build trees (secrets still caught by gitleaks on staged source)
exclude: |
  (?x)^(
    .*/node_modules/.*|
    .*/\.cxx/.*|
    .*/android/\.gradle/.*|
    .*/android/app/build/.*|
    .*/\.next/.*|
    .*/\.turbo/.*|
    .*/dist/.*|
    Edu/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-symlinks
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Catch type errors here rather than in a deploy. A build container that dies mid-typecheck
      # reports nothing useful, so the check has to have already happened on a dev machine.
      - id: typecheck-agent-portal
        name: typecheck agent-portal
        language: system
        entry: bash -c 'cd apps/agent-portal && npx tsc --noEmit'
        files: ^apps/agent-portal/.*\.(ts|tsx)$
        pass_filenames: false

      - id: typecheck-admin-portal
        name: typecheck admin-portal
        language: system
        entry: bash -c 'cd apps/admin-portal && npx tsc --noEmit'
        files: ^apps/admin-portal/.*\.(ts|tsx)$
        pass_filenames: false

      - id: typecheck-backend
        name: typecheck backend
        language: system
        entry: bash -c 'cd apps/backend && npx tsc --noEmit'
        files: ^apps/backend/.*\.ts$
        pass_filenames: false

  # Strip Cursor/Claude/Anthropic Co-authored-by / Made-with trailers (never in history)
  - repo: local
    hooks:
      - id: strip-ai-coauthors
        name: strip AI Co-authored-by / Made-with trailers
        language: script
        entry: scripts/git-hooks/prepare-commit-msg
        stages: [prepare-commit-msg]
        always_run: true
        pass_filenames: false
